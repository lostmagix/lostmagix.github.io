"use strict";
const VectorArt = (() => {
  function random(seed) {
    return () => { seed = (Math.imul(seed,1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  }
  function poly(c, pts, fill, stroke) {
    c.beginPath(); pts.forEach(([x,y],i) => i ? c.lineTo(Math.round(x),Math.round(y)) : c.moveTo(Math.round(x),Math.round(y))); c.closePath();
    if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.stroke();}
  }
  function line(c,x,y,X,Y,color){c.strokeStyle=color;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();}
  function gradient(c,y1,y2,stops) {
    const g=c.createLinearGradient(0,y1,0,y2);stops.forEach(([t,color])=>g.addColorStop(t,color));return g;
  }
  const palettes=[
    {name:"Neon horizon",sky:["#16182e","#44315c","#b16b8d","#f5a482"],sun:["#ffdc94","#ffa776","#f277a9"],grid:"#a780cb",land:["#4b3b6a","#342a50","#211d39"],wire:"#ac82d8",ground:"#30253c"},
    {name:"Lunar basin",sky:["#0e2031","#254856","#698f97","#a1cab7"],sun:["#d0fbd7","#93dbc9","#73a7b7"],grid:"#68adbd",land:["#34545d","#263f4c","#152c3b"],wire:"#8ec5cb",ground:"#19333d"},
    {name:"Afterglow city",sky:["#19142a","#56305c","#c15e85","#ffab87"],sun:["#fff2ab","#ffb774","#ff7f96"],grid:"#ff99b3",land:["#67436a","#452e50","#251b37"],wire:"#df92c6",ground:"#3b243e"}
  ];
  function scene(c,w,h,mode,t){

</script><script>
"use strict";
(() => {

  const segments=["4,1 20,1 22,3 19,6 6,6 2,3","23,4 25,6 25,20 22,23 20,20 20,8","23,25 25,28 25,42 23,45 20,42 20,29","6,43 19,43 22,46 20,48 4,48 2,46","1,28 4,25 6,28 6,41 3,45 1,42","1,6 3,4 6,8 6,20 3,23 1,20","5,22 20,22 22,24 19,27 6,27 3,24"];

  $("keyHelp").onclick=()=>{
    const rows=unlocked?[["Choose a game","Tab · Enter"],["Pause or resume","P"],["Close game","Esc"]]:[["Enter numbers","0–9 · ."],["Arithmetic","+  −  *  /"],["Evaluate","Enter or ="],["Delete last digit","Backspace"],["All clear","Esc or Delete"],["Percentage","%"]];
    const list=$("helpList");list.replaceChildren();for(const [a,b] of rows){const row=document.createElement("div"),txt=document.createElement("span"),key=document.createElement("kbd");txt.textContent=a;key.textContent=b;row.append(txt,key);list.append(row);}$("help").showModal();
