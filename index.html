<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14131b">
<title>Calculator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='1' width='24' height='30' rx='5' fill='%23443d50'/%3E%3Cpath fill='%23c4d7b6' d='M8 5h16v7H8z'/%3E%3Cpath fill='%23c6b4fb' d='M8 16h6v4H8zm0 7h6v4H8zm10-7h6v4h-6z'/%3E%3Cpath fill='%23ff9b69' d='M18 23h6v4h-6z'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#111117;--panel:#1c1b24;--border:#393641;--text:#f6f4fb;--muted:#aaa7ba;--purple:#c6b4fb;--mint:#b7efaf;--orange:#ff9b69;--mono:"IBM Plex Mono","Courier New",monospace;--sans:"Space Grotesk","Inter",Arial,sans-serif}
*{box-sizing:border-box}
html{min-height:100%;scrollbar-gutter:stable}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 25%,#211c2a45,transparent 52%),var(--bg);color:var(--text);font:16px/1.4 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,canvas:focus-visible{outline:3px solid #dfc7ff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-bank{position:absolute;width:0;height:0;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.wrap{width:min(1110px,calc(100% - 88px));margin-inline:auto}
.navtools{display:flex;gap:9px}
.toolbar,.square,.plain{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.toolbar,.square{border:1px solid var(--border);border-radius:7px;background:#211f29;color:#e0dce8}
.toolbar{height:36px;padding:0 13px;font-size:14px;font-weight:550}
.toolbar svg{width:17px;height:17px;color:#c8bddb}
.toolbar:hover,.square:hover,.plain:hover:not(:disabled){background:#302c3b}
.square{width:32px;height:31px;padding:0}
.square svg{width:15px;height:15px}
.page-title{padding:39px 0 24px}
.eyebrow,.small-label,.machine-foot,.lcd-top,.game-bar{font-family:var(--mono)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.15em;color:#c0addd}
.eyebrow i{width:19px;height:10px;background:repeating-linear-gradient(114deg,transparent 0 3px,#c2a7ff 3.5px 6px);transform:skew(-4deg)}
h1{font-size:clamp(48px,5.2vw,72px);line-height:1.05;letter-spacing:-.07em;margin:8px 0 0;font-weight:720}
.title-dot{color:var(--purple)}
h2,p{margin:0}
h2{font-size:18px;letter-spacing:-.025em}
.dialog-head,.game-bar,.game-actions{display:flex;align-items:center;justify-content:space-between}
.light{width:6px;height:6px;background:#b1efa1;border-radius:50%;box-shadow:0 0 8px #b1efa157}
.small-label{font-size:12px;letter-spacing:.11em;font-weight:bold;color:#ada6bb}
.plain{color:#c6bfd1;font-size:13px;background:transparent;border:1px solid #45404e;border-radius:5px;min-height:29px;padding:2px 10px}
.machine{position:relative;background:linear-gradient(126deg,#484352 0%,#36323e 35%,#302c36 100%);border-radius:20px;border:1px solid #665e70;padding:20px 26px 18px;box-shadow:inset 0 2px 0 #b8a9c22e,inset 0 -5px 0 #17151d80,0 10px 16px #0003}
.ribs{height:10px;width:46px;background:repeating-linear-gradient(111deg,transparent 0 4px,#201d25 4px 6px,#5d5563 6px 7px);transform:skew(-4deg)}
.screw{width:6px;height:6px;position:absolute;border-radius:50%;background:linear-gradient(135deg,#918696 0 35%,#28232e 35% 61%,#716878 61%);box-shadow:0 0 0 1px #211d2b80}
.s1{left:11px;top:11px}
.s2{right:11px;top:11px}
.s3{left:11px;bottom:13px}
.s4{right:11px;bottom:13px}
.screen-rim{padding:5px;background:#24232a;box-shadow:0 1px 0 #7a7280,inset 0 2px 2px #111118;border-radius:10px}
.lcd{color:#23352b;position:relative;height:101px;overflow:hidden;padding:7px 12px 10px;border-radius:5px;background:linear-gradient(135deg,#adc9ab,#c4d7b6);box-shadow:inset 0 2px 5px #34433365}
.lcd::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#25372c26 .55px,transparent .8px);background-size:3px 3px}
.lcd-top{position:relative;display:flex;justify-content:space-between;align-items:center;height:17px;color:#455744;font-weight:bold;font-size:11px;letter-spacing:.1em}
.lcd-top button{border:0;padding:3px;background:none;color:#455744;display:flex}
.lcd-top svg{width:16px;height:14px}
#formula{height:18px;line-height:18px;text-align:right;font-family:var(--mono);font-size:13px;color:#42523e}
#digits{height:46px;position:relative;display:flex;align-items:stretch;justify-content:flex-end}
.segments{width:100%;height:100%;stroke:none;overflow:visible}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:18px}
.key{height:clamp(44px,4.05vw,58px);padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#524d5d,#494451);border:1px solid #716979;border-bottom:3px solid #2b2730;border-radius:8px;box-shadow:0 2px 0 #1e1b23,0 0 0 1px #302a36;color:#faf7ff;font-size:25px;font-weight:550;font-variant-numeric:tabular-nums;line-height:1;user-select:none;touch-action:manipulation}
.key:hover{filter:brightness(1.14)}
.key:active,.key.pressed{transform:translateY(2px);box-shadow:0 0 0 1px #302a36}
.key.utility{background:linear-gradient(#6b617a,#60566f);border-color:#83768e;border-bottom-color:#42394b;color:#f3e9ff;font-size:19px}
.key.operator{background:linear-gradient(#cbbbf3,#baa7e6);border-color:#ded2fb;border-bottom-color:#8b75b5;color:#342743;font-size:28px}
.key.equal{background:linear-gradient(#ffb181,#ff9867);border-color:#ffcb9b;border-bottom-color:#b96d4c;color:#462e28;font-size:29px}
.key.wide{grid-column:span 2}
.machine-foot{display:flex;align-items:center;gap:7px;color:#d3c9d7;font-size:10px;letter-spacing:.14em;margin:17px 6px 2px}
.light{width:5px;height:5px}
.ribs{height:6px;flex:1;max-width:82px;margin-left:auto;background:repeating-linear-gradient(90deg,#28232d 0 2px,transparent 2px 5px)}
dialog{color:var(--text);border:1px solid #52485d;background:var(--panel);box-shadow:0 24px 100px #0009;padding:21px;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:16px;width:min(420px,calc(100% - 24px))}
dialog::backdrop{background:#09080eda;backdrop-filter:blur(5px)}
.dialog-head{gap:10px;margin-bottom:18px}
.dialog-head h2{font-size:22px}
.dialog-head .small-label{margin-bottom:3px}
#helpList>div{padding:10px 0;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:14px}
kbd{color:#dac6fc;font:13px var(--mono);background:#302a39;padding:3px 7px;border-radius:4px;border:1px solid #494151}
.arcade-title{display:flex;align-items:end;justify-content:space-between;gap:14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{border:1px solid var(--border);background:var(--panel);overflow:hidden;border-radius:13px;text-align:left;padding:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:#ab89d1;transform:translateY(-2px)}
.card canvas{width:100%;height:auto;aspect-ratio:3.6;display:block;image-rendering:pixelated}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding:15px 18px}
.card-foot small{font:12px var(--mono);letter-spacing:.09em;color:var(--purple)}
.card-foot strong{display:block;font-size:22px;letter-spacing:-.04em}
.card-play{background:#393240;color:var(--purple);border-radius:50%;padding:9px;display:flex}
#player{width:min(635px,calc(100% - 20px))}
.game-bar{font-size:13px;letter-spacing:.025em;margin:0 0 8px;color:var(--muted)}
.game-bar b{color:var(--mint)}
.stage{position:relative;border:1px solid #4d445d;border-radius:8px;overflow:hidden;background:#151221}
.stage canvas{width:100%;display:block;touch-action:none;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:9px;padding:12px;background:#13101dd9}
.overlay strong{font-size:clamp(22px,4vw,35px);letter-spacing:-.05em}
.overlay p{font-size:14px;color:#d1cbdc;max-width:390px}
.primary{background:var(--purple);border:0;border-radius:6px;padding:9px 16px;font-weight:bold;color:#231c2c;margin-top:4px}
.game-actions{gap:7px;margin-top:10px}
.game-actions>span{margin-right:auto;font-size:13px;color:var(--muted)}
.touch{display:flex;justify-content:center;gap:6px;margin-top:10px}
.touch:empty{display:none}
.touch button{height:37px;min-width:45px;touch-action:none;user-select:none}
.touch svg{width:18px;height:18px}
[hidden]{display:none!important}
button:focus:not(:focus-visible){outline:none}
@media(min-width:1500px){.wrap{width:min(1180px,calc(100% - 100px))}
.page-title{padding-top:50px}}
@media(max-width:850px){.wrap{width:calc(100% - 40px)}
.machine{padding:19px 17px 17px}
.keypad{gap:8px}
.key{height:46px}
.page-title{padding:30px 0 22px}}
@media(max-width:660px){.wrap{width:min(480px,calc(100% - 28px))}
.machine{order:-1;width:100%;padding:21px 22px 17px}
.key{height:47px}
.page-title{padding:24px 0 18px}
.toolbar{height:34px;padding:0 10px;font-size:13px}
.navtools{gap:6px}
.navtools .toolbar span{display:none}
.navtools .toolbar{width:36px}
.keypad{margin-top:15px}
.cards{grid-template-columns:1fr;gap:12px}
.game-actions{flex-wrap:wrap}
.eyebrow,.small-label{font-size:11px}
.arcade-title .toolbar{flex-shrink:0}
.touch button{min-height:42px}
.game-actions>span{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
main.wrap{padding-top:clamp(24px,6vh,70px);padding-bottom:40px}
main.calculator-layout{width:min(434px,calc(100% - 32px))}
.navtools{float:right;display:flex;gap:7px;position:relative;z-index:1}
.calculator-layout .navtools{margin-top:5px}
.calculator-layout .toolbar{width:34px;padding:0}
.calculator-layout .toolbar span{display:none}
.calculator-layout .page-title{padding:0 86px 20px 0}
.calculator-layout h1{font-size:clamp(35px,5vw,45px);margin:0}
.workspace{clear:both}
.machine{width:100%;padding-top:25px}
#arcadePage{clear:both}
.arcade-title{padding-top:20px}
#flagMode[aria-pressed="true"]{color:#292335;background:#ffd18d;border-color:#ffd18d}
@media(max-width:660px){main.wrap{padding-top:24px}.calculator-layout .page-title{padding-bottom:16px}}
</style>
</head>
<body>
<svg aria-hidden="true" class="icon-bank" xmlns="http://www.w3.org/2000/svg"><defs>

<symbol id="sound-off" viewBox="0 0 24 24"><path d="m11 5-5 4H3v6h3l5 4V5Zm5 4 6 6m0-6-6 6"/></symbol>
<symbol id="sound-on" viewBox="0 0 24 24"><path d="m11 5-5 4H3v6h3l5 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
<symbol id="keys" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M5 9h1m3 0h1m3 0h1m3 0h1M5 12h1m3 0h1m3 0h1m3 0h1m-10 3h8"/></symbol>





<symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>

<symbol id="backspace" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-7-7zM12 9l5 6m0-6-5 6"/></symbol>
<symbol id="calc-icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 7h8M8 12h2m4 0h2m-8 4h2m4 0h2"/></symbol>
</defs></svg>
<main class="wrap calculator-layout">
<div class="navtools"><button id="sound" class="toolbar" aria-pressed="false"><svg><use href="#sound-off"/></svg><span>Sound off</span></button><button id="keyHelp" class="toolbar"><svg><use href="#keys"/></svg><span>Keyboard</span></button></div>
<section id="calcPage" aria-labelledby="calcTitle">
<div class="page-title"><h1 id="calcTitle">Calculator<span class="title-dot">.</span></h1></div>
<div class="workspace">
<section class="machine" aria-label="Calculator keypad">
<i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>

<div class="screen-rim"><div class="lcd"><div class="lcd-top"><span>STANDARD</span><button id="del" aria-label="Delete last digit"><svg><use href="#backspace"/></svg></button></div><div id="formula" aria-hidden="true"></div><div id="digits" aria-hidden="true"></div><output id="result" class="sr" aria-live="polite">0</output></div></div>
<div id="keypad" class="keypad" aria-label="Calculator buttons"></div>
<div class="machine-foot"><div class="light"></div>POWER<span class="ribs"></span></div>
</section>
</div></section>
<section id="arcadePage" hidden aria-labelledby="arcadeTitle"><div class="page-title arcade-title"><div><div class="eyebrow"><i></i> GAME LIBRARY</div><h1 id="arcadeTitle" tabindex="-1">Arcade<span class="title-dot">.</span></h1></div><button id="returnCalc" class="toolbar"><svg><use href="#calc-icon"/></svg>Calculator</button></div><div id="cards" class="cards"></div></section>
</main>

<dialog id="help"><div class="dialog-head"><h2>Keyboard controls</h2><button class="square" data-close="help" aria-label="Close keyboard controls"><svg><use href="#close"/></svg></button></div><div id="helpList"></div></dialog>
<dialog id="player"><div class="dialog-head"><div><div id="genre" class="small-label"></div><h2 id="gameTitle">Game</h2></div><button class="square" data-close="player" aria-label="Close game"><svg><use href="#close"/></svg></button></div><div class="game-bar"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div><div class="stage"><canvas width="480" height="320" id="gameCanvas" tabindex="0" aria-label="Game board"></canvas><div id="overlay" class="overlay"><strong id="overlayTitle"></strong><p id="overlayText"></p><button id="primary" class="primary"></button></div></div><div id="touch" class="touch"></div><div class="game-actions"><span id="gameHint"></span><button id="flagMode" class="plain" aria-pressed="false" hidden>Flag mode</button><button id="pauseGame" class="plain">Pause</button><button id="restartGame" class="plain">Restart</button></div><p id="gameStatus" class="sr" role="status"></p></dialog>
<script>
"use strict";
const VectorArt = (() => {
  function random(seed) {
    return () => { seed = (Math.imul(seed,1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  }
  function poly(c, pts, fill, stroke) {
    c.beginPath(); pts.forEach(([x,y],i) => i ? c.lineTo(Math.round(x),Math.round(y)) : c.moveTo(Math.round(x),Math.round(y))); c.closePath();
    if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.stroke();}
  }
  function line(c,x,y,X,Y,color){c.strokeStyle=color;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();}
  function gradient(c,y1,y2,stops) {
    const g=c.createLinearGradient(0,y1,0,y2);stops.forEach(([t,color])=>g.addColorStop(t,color));return g;
  }
  function cover(canvas,id){
    const w=480,h=134;canvas.width=w;canvas.height=h;const c=canvas.getContext("2d"),rng=random(3094);
    const tint=["#b7eba6","#cbb2ff","#ffb58a","#8adcd5","#f5bd81","#a5e3ce","#c4b1e5","#a4e6c9"][id],bg=["#2a4439","#3e304f","#492e45","#22434a","#594233","#2d4945","#40344e","#284851"][id];
    c.fillStyle=gradient(c,0,h,[[0,"#191724"],[1,bg]]);c.fillRect(0,0,w,h);
    for(let x=0;x<w;x+=14)for(let y=0;y<h;y+=14){c.fillStyle=tint+"35";c.fillRect(x,y,1,1);}
    if(id===0){const path=[[3,8],[7,8],[7,5],[12,5],[12,7],[17,7],[17,3],[22,3],[22,5],[26,5]];for(let j=1;j<path.length;j++){let [x,y]=path[j-1];const [ex,ey]=path[j];while(x!==ex||y!==ey){c.fillStyle=tint;c.fillRect(x*12,y*12,10,10);x+=Math.sign(ex-x);y+=Math.sign(ey-y);}}c.fillRect(312,60,13,11);c.fillStyle="#233125";c.fillRect(320,61,3,3);c.fillStyle="#ff9c82";c.fillRect(370,61,9,9);}
    if(id===1){["#ed9d99","#d19bca","#bda0f6"].forEach((col,r)=>{for(let j=0;j<10;j++){if(j===6&&r===2)continue;c.fillStyle=col;c.fillRect(32+j*41,15+r*19,37,13);c.fillStyle="#ffffff45";c.fillRect(32+j*41,15+r*19,37,2);}});line(c,294,83,334,106,tint+"80");c.fillStyle="#ffe1ae";c.fillRect(291,80,8,8);c.fillStyle=tint;c.fillRect(300,113,70,6);}
    if(id===2){for(let j=0;j<35;j++){let x=rng()*w,y=rng()*h;c.fillStyle="#d7c6e3";c.fillRect(x,y,2,2);}for(let j=0;j<6;j++){const x=25+j*78,y=12+rng()*95,r=7+rng()*11;poly(c,[[x-r,y-4],[x-5,y-r],[x+r*.8,y-r*.65],[x+r,y+3],[x+3,y+r],[x-r*.8,y+r*.65]],"#624351","#e29489");}poly(c,[[226,97],[242,55],[259,97],[242,87]],"#ffd6a1","#fff2c9");poly(c,[[236,95],[242,112],[248,95]],"#f18188");}
    if(id===3){const symbols=["◆","+","●","×","◆","●"];for(let j=0;j<6;j++){const x=37+j*69,y=34+(j%2)*9;c.fillStyle=j===1||j===4?"#97d5c9":"#3b7477";c.fillRect(x,y,48,56);c.strokeStyle="#bde5d4";c.strokeRect(x+.5,y+.5,47,55);c.fillStyle=j===1||j===4?"#254650":"#99bfb9";c.font="bold 24px monospace";c.textAlign="center";c.fillText(symbols[j],x+24,y+36);}}
    if(id===4){
      const numbers=[2,4,8,16,32], fills=["#c4d6c0","#e4d1a9","#f2b17d","#f29578","#dd8eae"];
      numbers.forEach((n,i)=>{const x=42+i*82,y=32+(i%2)*8;c.fillStyle=fills[i];c.fillRect(x,y,60,60);c.fillStyle="#332937";c.font="bold 23px monospace";c.textAlign="center";c.fillText(n,x+30,y+38);});
    }
    if(id===5){
      for(let y=4;y<h;y+=17){c.fillStyle="#7b9291";c.fillRect(w/2-1,y,2,9);}
      c.fillStyle=tint;c.fillRect(44,46,8,60);c.fillStyle="#eaa1ae";c.fillRect(426,21,8,60);
      for(let i=1;i<=5;i++){c.fillStyle="rgba(240,222,201,"+(i*.13)+")";c.fillRect(135+i*17,21+i*7,6,6);}c.fillStyle="#fff0d7";c.fillRect(235,62,9,9);
    }
    if(id===6){
      const tiles=["1","","⚑","","2","","","1","","⚑","1","","","2","","1","",""];
      tiles.forEach((symbol,i)=>{const x=77+(i%9)*37,y=30+Math.floor(i/9)*37;c.fillStyle=symbol&&symbol!=="⚑"?"#34303d":"#605370";c.fillRect(x,y,33,33);c.fillStyle=symbol==="⚑"?"#ffd18e":symbol==="2"?"#a8dbaf":"#9ec8f9";c.font="bold 18px monospace";c.textAlign="center";c.fillText(symbol,x+16,y+23);});
    }
    if(id===7){
      for(const [x,mid] of [[74,45],[251,77],[402,53]]){c.fillStyle="#477879";c.fillRect(x,0,28,mid-25);c.fillRect(x,mid+25,28,h-mid-25);c.fillStyle=tint;c.fillRect(x,mid-29,28,4);c.fillRect(x,mid+25,28,4);}
      c.fillStyle="#ffc28a";c.fillRect(171,53,20,17);c.fillStyle="#db917d";c.fillRect(165,61,11,8);c.fillStyle="#39303a";c.fillRect(184,56,3,3);
    }
  }
  return {cover};
})();
</script><script>
"use strict";
const Arcade = (() => {
  const games=[
    {title:"Neon Snake",genre:"CLASSIC",intro:"Collect the orange pixels. Each one makes your snake longer. Keep clear of the walls and your tail.",hint:"Arrow keys, WASD or swipe",directions:["up","left","down","right"],create:snake},
    {title:"Brick Breaker",genre:"ARCADE",intro:"Bounce the ball off your paddle and clear every brick. Hit the edge of the paddle to change your angle.",hint:"Move with A / D, arrows or drag",directions:["left","right"],create:breaker},
